name: Update Valorant rank

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay scheduled runs)
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch rank
        run: python scripts/update_rank.py
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rank.json
          git diff --cached --quiet || (git commit -m "Update Valorant rank" && git push)
